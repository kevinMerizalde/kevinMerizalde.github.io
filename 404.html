<!doctype html>                                                                                                                                                                    
  <html lang="es">                                                                                                                                                                   
  <head>                                                                                                                                                                             
  <meta charset="utf-8">                                                                                                                                                             
  <meta name="viewport" content="width=device-width, initial-scale=1">                                                                                                               
  <title>Fubtol</title>                                                                                                                                                              
  <style>                                                                                                                                                                            
    body { font-family: system-ui, sans-serif; background: #0A1F1C; color: #fff; display: flex;                                                                                      
           align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 24px; }                                                                              
    .card { max-width: 360px; text-align: center; }                                                                                                                                  
    h1 { color: #2E7D5A; font-size: 22px; margin-bottom: 8px; }                                                                                                                      
    p { color: #9CA3AF; font-size: 14px; line-height: 1.5; }                                                                                                                         
  </style>                                                                                                                                                                           
  </head>                                                                                                                                                                            
  <body>                                                                                                                                                                             
    <div class="card">                                                                                                                                                               
      <h1>Fubtol</h1>                                                                                                                                                                
      <p id="message">Cargando...</p>                                                                                                                                                
    </div>                                                                                                                                                                           
    <script>                                                                                                                                                                         
      var match = location.pathname.match(/\/match\/([^/]+)/);                                                                                                                       
      var messageEl = document.getElementById("message");                                                                                                                            
      if (match) {                                                                                                                                                                   
        var matchId = match[1];                                                                                                                                                      
        messageEl.textContent = "Abriendo el partido en la app Fubtol...";                                                                                                           
        location.href = "fubtol://match/" + matchId;                                                                                                                                 
        setTimeout(function () {                                                                                                                                                     
          messageEl.textContent = "Si no se abrió, instala la app Fubtol para unirte a este partido.";                                                                               
        }, 1500);                                                                                                                                                                    
      } else {                                                                                                                                                                       
        messageEl.textContent = "Página no encontrada.";                                                                                                                             
      }                                                                                                                                                                              
    </script>                                                                                                                                                                        
  </body>                                                                                                                                                                            
  </html>
